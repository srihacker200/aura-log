{% extends 'base.html' %}{% block title %}Students · AURA LOG{% endblock %}{% block content %}<section class="intro"><div><p class="eyebrow">ROSTER</p><h1>Students</h1><p class="subtitle">Manage roster and optional student login email.</p></div></section><section class="panel form-panel"><h2>Add student</h2><form method="post" class="form-row"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Name<input name="full_name" maxlength="100" required></label><label>Email (optional)<input type="email" name="email" maxlength="254"></label><label>Class<select name="class_id"><option value="">Unassigned</option>{% for c in classes %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></label><button class="primary-button">Add student</button></form></section><section class="panel records-panel spaced"><div class="table-wrap"><table><thead><tr><th>STUDENT</th><th>EMAIL</th><th>CLASS</th><th>ACTIVE</th><th></th></tr></thead><tbody>{% for s in students %}<tr><form method="post" action="{{ url_for('update_student',student_id=s.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><td><input name="full_name" value="{{ s.full_name }}" maxlength="100" required></td><td><input name="email" type="email" value="{{ s.email or '' }}"></td><td><select name="class_id"><option value="">Unassigned</option>{% for c in classes %}<option value="{{ c.id }}" {% if s.class_id==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></td><td><select name="active"><option value="1" {% if s.active %}selected{% endif %}>Yes</option><option value="0" {% if not s.active %}selected{% endif %}>No</option></select></td><td><button class="small-button">Save</button></td></form></tr>{% else %}<tr><td colspan="5">No students yet.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
