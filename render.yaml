services:
  - type: web
    name: aura-log
    runtime: python
    plan: starter
    branch: copilot/aura-log-premium-foundation
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 60 app:app
    healthCheckPath: /ready
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: aura_log
      - key: SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_TOKEN
        sync: false
      - key: COOKIE_SECURE
        value: "1"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "1"
      - key: EMAIL_ABSENCE_NOTIFICATIONS
        value: "0"
