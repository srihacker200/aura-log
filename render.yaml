services:
  - type: web
    name: aura-log
    runtime: python
    plan: starter
    branch: copilot/aura-log-premium-foundation
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: aura_log
      - key: SECRET_KEY
        generateValue: true
      - key: BOOTSTRAP_TOKEN
        sync: false
      - key: COOKIE_SECURE
        value: "1"
