services:
  - type: web
    name: aura-log
    runtime: python
    plan: starter
    branch: copilot/aura-log-premium-foundation
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /login
    disk:
      name: aura-log-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/aura_log.db
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "1"
